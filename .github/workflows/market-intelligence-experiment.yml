name: SMART market intelligence experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_market_intelligence_v1.py'
      - 'docs/RESEARCH_MARKET_INTELLIGENCE_V1.md'
      - 'requirements.txt'
      - 'runtime/history/**'

permissions:
  contents: write

jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run market intelligence v1
        run: PYTHONPATH=src python scripts/run_market_intelligence_v1.py
      - name: Persist result
        run: |
          git config user.name 'SMART Market Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/experiments/پالایش/market_intelligence_v1_results.json
          git diff --cached --quiet || git commit -m 'experiment: persist market intelligence v1 result [skip ci]'
          git push
