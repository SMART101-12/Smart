name: Split AYAR history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Split AYAR history
        run: python tools/split_ayar_history.py
      - name: Package monthly history
        run: |
          mkdir -p artifacts/ayar-monthly
          cp runtime/market_raw/history/عیار/monthly/*.json artifacts/ayar-monthly/
      - name: Upload AYAR monthly history artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayar-monthly-history
          path: artifacts/ayar-monthly/
          if-no-files-found: error
          retention-days: 30
