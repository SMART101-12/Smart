name: Split AYAR history

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/split_ayar_history.py'
      - 'runtime/market_raw/history/عیار/raw/**'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Split AYAR history
        run: python tools/split_ayar_history.py
      - name: Commit monthly files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'runtime/market_raw/history/عیار/monthly/'
          if git diff --cached --quiet; then
            echo 'No monthly changes.'
          else
            git commit -m 'Generate monthly AYAR history files'
            git push
          fi
