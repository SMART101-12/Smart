name: Collect all TSETMC symbols

on:
  push:
    branches: [agent/data-gap-recovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/data-gap-recovery
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install requests

      - name: Collect TSETMC
        run: python scripts/collect_all_tsetmc.py

      - name: Commit collected data
        run: |
          git config user.name "SMART TSETMC Collector"
          git config user.email "actions@github.com"
          git add runtime/tsetmc
          git diff --cached --quiet || git commit -m "collect all TSETMC symbol data"
          git push origin agent/data-gap-recovery
