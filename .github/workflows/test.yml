name: SMART tests

on:
  push:
    branches: [main, master, agent/data-gap-recovery]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/codal_reports_behavior.cjs
      - run: node tests/positions_behavior.cjs
      - run: node tests/dashboard_behavior.cjs
