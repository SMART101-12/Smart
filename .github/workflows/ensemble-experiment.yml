name: SMART model experiments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 200-indicator ensemble experiment
        run: PYTHONPATH=src python scripts/run_ensemble_experiments.py
      - name: Run custom model experiment
        run: PYTHONPATH=src python scripts/run_custom_model.py
      - name: Run research-driven Iran market intelligence experiment
        run: PYTHONPATH=src python scripts/run_market_intelligence_v1.py
      - name: Persist experiment results
        run: |
          git config user.name 'SMART Experiment Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/experiments/پالایش/indicator_ensemble_results.json runtime/experiments/پالایش/custom_model_v1_results.json runtime/experiments/پالایش/market_intelligence_v1_results.json
          git diff --cached --quiet || git commit -m 'experiment: persist SMART model results [skip ci]'
          git push
