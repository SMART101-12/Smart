name: SMART 200-indicator ensemble experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ensemble experiment
        run: PYTHONPATH=src python scripts/run_ensemble_experiments.py
      - name: Persist leaderboard
        run: |
          git config user.name 'SMART Ensemble Experiment Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/experiments/پالایش/indicator_ensemble_results.json
          git diff --cached --quiet || git commit -m 'experiment: persist 200-indicator ensemble leaderboard [skip ci]'
          git push
