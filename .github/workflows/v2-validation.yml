name: SMART V2 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/smart_v2/**'
      - 'tests/v2/**'
      - 'scripts/v2/**'
      - 'runtime/history/پالایش/**'
      - '.github/workflows/v2-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: V2 unit tests
        env:
          PYTHONPATH: ./src
        run: pytest -q tests/v2
      - name: PALAYESH validation
        env:
          PYTHONPATH: ./src
        run: python scripts/v2/validate_palaysh_history.py
