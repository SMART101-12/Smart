[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-market"
version = "0.1.0"
description = "SMART market decision-support system"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.66",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.5.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
